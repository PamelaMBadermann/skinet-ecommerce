<header class="shadow-md p-3 w-full">
    <div class="flex align-middle items-center justify-between max-w-sc-2xl mx-auto">
        <img routerLink="/" src="/images/icone-sacola-sem-texto-e-sem-fundo-para-dark-theme.png" alt="app logo" class="max-h-16">
        <nav class="flex gap-3 my-2 uppercase text-2xl">
            <a routerLink="/"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}"
            >Início</a>
            <a routerLink="/shop" routerLinkActive="active">Loja</a>
            <a>Contato</a>
        </nav>
        <div class="flex gap-3 align-middle">
            <a matBadge="5" matBadgeSize="large" class="custom-badge mt-2 mr-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            <button mat-stroked-button>Entrar</button>
            <button mat-stroked-button>Criar Conta</button>
        </div>
    </div>
</header>
